{% extends "base.html" %}
{% block title %}Користувачі{% endblock %}

{% block content %}
<h1>Користувачі <span class="badge bg-secondary">{{ count }}</span></h1>
{% if users %}
<table class="table table-striped w-auto">
    <thead><tr><th>#</th><th>Ім'я</th><th>Email</th></tr></thead>
    <tbody>
    {% for user in users %}
        <tr><td>{{ user.id }}</td><td>{{ user.username }}</td><td>{{ user.email }}</td></tr>
    {% endfor %}
    </tbody>
</table>
{% else %}
<p class="text-muted">Користувачів ще немає.</p>
{% endif %}
{% endblock %}
