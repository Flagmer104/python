{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="card shadow-sm p-4 mx-auto" style="max-width: 400px;">
    <h2 class="text-center mb-3">Login</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label" for="login">Ім'я користувача</label>
            <input class="form-control" id="login" name="login" maxlength="20" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Увійти</button>
    </form>
</div>
{% endblock %}
